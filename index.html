<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معسكر وايسي 2026 - درجات الطلاب (فيد باك وترتيب ومزامنة)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبات Firebase للـ Realtime Database -->

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b192c; color: #ffffff; }
        .card-bg { background-color: #1e3e62; border: 1px solid #00000033; }

</head>
<body class="min-h-screen flex flex-col justify-between pb-12">

    <!-- رأس الصفحة -->
    <header class="w-full py-6 px-4 bg-[#1e3e62] shadow-md text-center border-b border-[#00000044]">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center">
            <h1 class="text-3xl md:text-5xl font-black text-white tracking-wider mb-1">معسكر وايسي</h1>
            <p class="text-lg md:text-xl font-bold text-sky-300 tracking-widest">WAICY BOOTCAMP 2026</p>
            <div id="syncStatus" class="mt-2 text-xs px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-300">جاري الاتصال بالسحابة...</div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        
        <!-- شريط البحث والترتيب -->
        <div class="mb-6 flex flex-col sm:flex-row gap-3 items-center justify-between">
            <div class="w-full sm:w-2/3">
                <input type="text" id="searchInput" placeholder="ابحث عن اسم الطالب..." 
                    class="w-full px-4 py-3 rounded-xl bg-[#1e3e62] text-white placeholder-gray-400 border border-transparent focus:border-sky-400 focus:outline-none shadow-inner">
            </div>
            <div class="w-full sm:w-1/3">
                <select id="sortSelect" class="w-full px-4 py-3 rounded-xl bg-[#1e3e62] text-white border border-transparent focus:border-sky-400 focus:outline-none shadow-inner cursor-pointer">
                    <option value="default">الترتيب الافتراضي</option>
                    <option value="highest">الدرجة: من الأعلى للأقل 🔻</option>
                    <option value="lowest">الدرجة: من الأقل للأعلى 🔺</option>
                    <option value="name">ترتيب أبجدي (حسب الاسم) أ-ي</option>
                </select>
            </div>
        </div>

        <div id="studentsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- قائمة الطلاب -->
        </div>
    </main>

    <!-- الفوتر (أسفل الصفحة) -->
    <footer class="w-full py-4 text-center text-gray-400 border-t border-[#1e3e62] mt-8">
        <p class="text-sm font-semibold">إجمالي عدد الطلاب في المعسكر: <span id="totalStudentsCount" class="text-sky-300 font-bold">51</span> طالب/طالبة</p>
    </footer>

    <!-- نافذة تعديل الدرجات -->
    <div id="editModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="card-bg w-full max-w-md rounded-2xl p-6 shadow-2xl relative border border-sky-500/30 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-gray-400 hover:text-white text-xl font-bold">✕</button>
            <div class="text-center mb-4">
                <h3 id="modalStudentName" class="text-2xl font-bold text-white mb-2">اسم الطالب</h3>
                <div class="text-4xl font-black text-sky-400 mb-1" id="modalStudentScore">0</div>
                <p class="text-xs text-gray-400">الدرجة الحالية</p>
            </div>
            
            <!-- أزرار التعديل السريع -->
            <div class="grid grid-cols-4 gap-2 mb-4">
                <button onclick="adjustScore(-5)" class="py-2.5 bg-red-600/70 hover:bg-red-600 text-white font-bold rounded-xl transition">-5</button>
                <button onclick="adjustScore(-1)" class="py-2.5 bg-red-500/50 hover:bg-red-500 text-white font-bold rounded-xl transition">-1</button>
                <button onclick="adjustScore(1)" class="py-2.5 bg-emerald-500/50 hover:bg-emerald-500 text-white font-bold rounded-xl transition">+1</button>
                <button onclick="adjustScore(5)" class="py-2.5 bg-emerald-600/70 hover:bg-emerald-600 text-white font-bold rounded-xl transition">+5</button>
            </div>

            <div class="mb-4 flex gap-2">
                <input type="number" id="customScoreInput" placeholder="أدخل درجة جديدة..." class="w-full px-4 py-2 rounded-xl bg-black/40 text-white border border-gray-600 focus:border-sky-400 focus:outline-none text-sm">
                <button onclick="setCustomScore()" class="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-xl transition text-sm">تعيين</button>
            </div>

            <!-- اختيار الشارة / الأيقونة -->
            <div class="mb-4">
                <label class="block text-xs text-gray-300 mb-2 text-center">اختر شارة التميز:</label>
                <div class="flex justify-center gap-2">
                    <button onclick="selectBadge('👑')" class="text-xl p-2 bg-black/30 rounded-xl hover:bg-sky-500/30 transition">👑</button>
                    <button onclick="selectBadge('⭐')" class="text-xl p-2 bg-black/30 rounded-xl hover:bg-sky-500/30 transition">⭐</button>
                    <button onclick="selectBadge('❤️')" class="text-xl p-2 bg-black/30 rounded-xl hover:bg-sky-500/30 transition">❤️</button>
                    <button onclick="selectBadge('🥇')" class="text-xl p-2 bg-black/30 rounded-xl hover:bg-sky-500/30 transition">🥇</button>
                    <button onclick="selectBadge('🚀')" class="text-xl p-2 bg-black/30 rounded-xl hover:bg-sky-500/30 transition">🚀</button>
                    <button onclick="selectBadge('')" class="text-xs px-2 py-1 bg-red-900/40 text-red-300 rounded-xl hover:bg-red-900/60 transition">إزالة</button>
                </div>
            </div>

            <!-- قسم الفيد باك واسم المدرب -->
            <div class="border-t border-gray-600/50 pt-4">
                <label class="block text-xs text-sky-300 mb-2 font-bold text-center">💬 تسجيل إجراء (فيد باك):</label>
                <div class="space-y-2">
                    <select id="feedbackType" class="w-full px-3 py-2 rounded-xl bg-black/40 text-white border border-gray-600 focus:border-sky-400 focus:outline-none text-xs cursor-pointer">
                        <option value="">-- اختر نوع الفيد باك --</option>
                        <option value="💬 فيد باك إيجابي">💬 فيد باك إيجابي</option>
                        <option value="💡 ملاحظة تطويرية">💡 ملاحظة تطويرية</option>
                        <option value="⚠️ تنبيه أداء">⚠️ تنبيه أداء</option>
                    </select>

                    <select id="feedbackInstructor" class="w-full px-3 py-2 rounded-xl bg-black/40 text-white border border-gray-600 focus:border-sky-400 focus:outline-none text-xs cursor-pointer">
                        <option value="">-- اختر اسم المدرب --</option>
                        <option value="سدرة عبد البصير">سدرة عبد البصير</option>
                        <option value="سليمان النجدي">سليمان النجدي</option>
                        <option value="أسامة عبد البصير">أسامة عبد البصير</option>
                        <option value="أنس مراشدة">أنس مراشدة</option>
                        <option value="أسماء سنان">أسماء سنان</option>
                        <option value="الوليد العنزي">الوليد العنزي</option>
                    </select>

                    <div class="flex gap-2 pt-1">
                        <button onclick="saveFeedback()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition text-xs">حفظ الفيد باك</button>
                        <button onclick="clearFeedback()" class="px-3 py-2 bg-red-900/50 hover:bg-red-900 text-red-200 rounded-xl transition text-xs">حذف</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const firebaseConfig = {

            messagingSenderId: "562566169115",

        };

        const initialStudents = [
            { id: 1, name: "محمد عمير القحطاني", score: 90, badge: "", feedback: "", instructor: "" },

            { id: 44, name: "نرجس الحرز", score: 127, badge: "", feedback: "", instructor: "" },
            { id: 45, name: "يافا البشير", score: 108, badge: "", feedback: "", instructor: "" },
            { id: 46, name: "حلا الهذلي", score: 112, badge: "", feedback: "", instructor: "" },
            { id: 47, name: "ديم القاضي", score: 111, badge: "", feedback: "", instructor: "" },
            { id: 48, name: "تالا مخدوم", score: 121, badge: "", feedback: "", instructor: "" },
            { id: 49, name: "توليب السلامة", score: 100, badge: "", feedback: "", instructor: "" },
            { id: 50, name: "الجازي عسيري", score: 114, badge: "", feedback: "", instructor: "" },
            { id: 51, name: "بيسان عسيري", score: 114, badge: "", feedback: "", instructor: "" }
        ];

        let students = [];
        let currentActiveId = null;
        let db = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.error(e);
        }

        function initApp() {
            if (!db) {
                document.getElementById('syncStatus').innerText = "وضع التخزين المحلي";
                students = initialStudents;
                renderStudents();
                return;
            }

            const dbRef = db.ref('students_data');
            
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    students = data;
                    renderStudents();
                    document.getElementById('syncStatus').innerText = "متصل بالسحابة (مزامنة فورية 🟢)";
                    document.getElementById('syncStatus').className = "mt-2 text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300";
                } else {
                    dbRef.set(initialStudents);
                }
            }, (error) => {
                document.getElementById('syncStatus').innerText = "خطأ في الاتصال السحابي";
                document.getElementById('syncStatus').className = "mt-2 text-xs px-3 py-1 rounded-full bg-red-500/20 text-red-300";
            });
        }

        function updateCloud() {
            renderStudents();
            if (db) {
                db.ref('students_data').set(students);
            }
        }

        function renderStudents() {
            const container = document.getElementById('studentsContainer');
            container.innerHTML = '';

            const filter = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = students.filter(s => s.name.toLowerCase().includes(filter));

            if (sortBy === 'highest') {
                filtered.sort((a, b) => b.score - a.score);
            } else if (sortBy === 'lowest') {
                filtered.sort((a, b) => a.score - b.score);
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            } else {
                filtered.sort((a, b) => a.id - b.id);
            }

            document.getElementById('totalStudentsCount').innerText = students.length;

            filtered.forEach(student => {
                const card = document.createElement('div');
                card.className = "card-bg p-4 rounded-2xl flex flex-col justify-between cursor-pointer hover:border-sky-400 transition shadow-md gap-2";
                card.onclick = () => openModal(student.id);

                let feedbackHtml = '';
                if (student.feedback && student.instructor) {
                    feedbackHtml = `<div class="text-[11px] text-sky-200 bg-sky-950/60 px-2 py-1 rounded-lg mt-1 border border-sky-800/40">
                        ${student.feedback} <span class="text-gray-400">(${student.instructor})</span>
                    </div>`;
                }

                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="text-2xl">${student.badge || ''}</span>
                            <div class="truncate">
                                <h4 class="font-bold text-base text-white truncate">${student.name}</h4>
                                <span class="text-xs text-gray-400">انقر للتعديل والفيد باك</span>
                            </div>
                        </div>
                        <div class="text-xl font-black text-sky-400 bg-black/30 px-3 py-1.5 rounded-xl min-w-[60px] text-center">
                            ${student.score}
                        </div>
                    </div>
                    ${feedbackHtml}
                `;
                container.appendChild(card);
            });
        }

        function openModal(id) {
            currentActiveId = id;
            const student = students.find(s => s.id === id);
            if (!student) return;

            document.getElementById('modalStudentName').innerText = student.name;
            document.getElementById('modalStudentScore').innerText = student.score;
            document.getElementById('customScoreInput').value = '';
            document.getElementById('feedbackType').value = student.feedback || '';
            document.getElementById('feedbackInstructor').value = student.instructor || '';
            
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('flex');
            document.getElementById('editModal').classList.add('hidden');
            currentActiveId = null;
        }

        function adjustScore(amount) {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.score = Math.max(0, student.score + amount);
                updateCloud();
                document.getElementById('modalStudentScore').innerText = student.score;
            }
        }

        function setCustomScore() {
            if (currentActiveId === null) return;
            const val = document.getElementById('customScoreInput').value;
            if (val === '') return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.score = Math.max(0, Number(val));
                updateCloud();
                document.getElementById('modalStudentScore').innerText = student.score;
                document.getElementById('customScoreInput').value = '';
            }
        }

        function selectBadge(badgeEmoji) {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.badge = badgeEmoji;
                updateCloud();
                closeModal();
            }
        }

        function saveFeedback() {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.feedback = document.getElementById('feedbackType').value;
                student.instructor = document.getElementById('feedbackInstructor').value;
                updateCloud();
                closeModal();
            }
        }

        function clearFeedback() {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.feedback = '';
                student.instructor = '';
                updateCloud();
                closeModal();
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderStudents);
        document.getElementById('sortSelect').addEventListener('change', renderStudents);

        window.onload = initApp;
    </script>
</body>
</html>
