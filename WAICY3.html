        function initApp() {
            if (!db) {
                document.getElementById('syncStatus').innerText = "وضع التخزين المحلي";
                students = initialStudents;
                renderStudents();
                return;
            }

            const dbRef = db.ref('students_data');
            
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.length > 0 && data[0].gender) {
                    students = data;
                } else {
                    students = initialStudents;
                    dbRef.set(initialStudents);
                }
                renderStudents();
                document.getElementById('syncStatus').innerText = "متصل بالسحابة (مزامنة فورية 🟢)";
                document.getElementById('syncStatus').className = "mt-2 text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300";

            });
        }

        function updateCloud() {

        function renderStudents() {
            const boysContainer = document.getElementById('boysContainer');
            const girlsContainer = document.getElementById('girlsContainer');
            boysContainer.innerHTML = '';
            girlsContainer.innerHTML = '';

            const filter = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = students.filter(s => 
                s.name.toLowerCase().includes(filter) || 
                (s.idea && s.idea.toLowerCase().includes(filter)) ||
                (s.tracks && s.tracks.some(t => t.toLowerCase().includes(filter)))
            );

            if (sortBy === 'highest') {
                filtered.sort((a, b) => b.score - a.score);
            } else if (sortBy === 'lowest') {
                filtered.sort((a, b) => a.score - b.score);
            } else if (sortBy === 'name') {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            } else {
                filtered.sort((a, b) => a.id - b.id);
            }

            let boysList = filtered.filter(s => s.gender === 'boy');
            let girlsList = filtered.filter(s => s.gender === 'girl');

            document.getElementById('boysCount').innerText = boysList.length + ' طالب';
            document.getElementById('girlsCount').innerText = girlsList.length + ' طالبة';
            document.getElementById('totalStudentsCount').innerText = students.length;

            boysList.forEach(student => {
                boysContainer.appendChild(createStudentCard(student));
            });

            girlsList.forEach(student => {
                girlsContainer.appendChild(createStudentCard(student));
            });
        }

        function createStudentCard(student) {
            const card = document.createElement('div');
            card.className = "card-bg p-3 rounded-xl flex flex-col justify-between cursor-pointer hover:border-sky-400 transition shadow-md gap-2";
            card.onclick = () => openModal(student.id);

            let tracksHtml = '';
            if (student.tracks && student.tracks.length > 0) {
                tracksHtml = `<div class="flex flex-wrap gap-1 mt-1">`;
                student.tracks.forEach(t => {
                    tracksHtml += `<span class="text-[10px] bg-sky-900/70 text-sky-200 px-2 py-0.5 rounded-full border border-sky-700/50">${t}</span>`;
                });
                tracksHtml += `</div>`;
            }

            let ideaHtml = '';
            if (student.idea) {
                ideaHtml = `<div class="text-[11px] text-gray-300 bg-black/30 px-2 py-1 rounded-lg mt-1 italic border-r-2 border-sky-400">
                    💡 الفكرة: ${student.idea}
                </div>`;
            }

            let feedbackHtml = '';
            if (student.feedback && student.instructor) {
                feedbackHtml = `<div class="text-[11px] text-emerald-200 bg-emerald-950/60 px-2 py-1 rounded-lg mt-1 border border-emerald-800/40">
                    ${student.feedback} <span class="text-gray-400">(${student.instructor})</span>
                </div>`;
            }

            card.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="text-xl">${student.badge || ''}</span>
                        <div class="truncate">
                            <h4 class="font-bold text-sm text-white truncate">${student.name}</h4>
                            <span class="text-[10px] text-gray-400">انقر للتعديل والتقييم</span>
                        </div>
                    </div>
                    <div class="text-lg font-black text-sky-400 bg-black/30 px-2.5 py-1 rounded-xl min-w-[50px] text-center">
                        ${student.score}
                    </div>
                </div>
                ${tracksHtml}
                ${ideaHtml}
                ${feedbackHtml}
            `;
            return card;
        }

        function openModal(id) {
            currentActiveId = id;
            const student = students.find(s => s.id === id);
            if (!student) return;

            document.getElementById('modalStudentName').innerText = student.name;
            document.getElementById('modalStudentScore').innerText = student.score;
            document.getElementById('customScoreInput').value = '';
            document.getElementById('projectIdeaInput').value = student.idea || '';
            document.getElementById('feedbackType').value = student.feedback || '';
            document.getElementById('feedbackInstructor').value = student.instructor || '';
            
            // تحديد المسارات المحددة مسبقاً
            const checkboxes = document.querySelectorAll('.track-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = student.tracks && student.tracks.includes(cb.value);
            });

            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('flex');
            document.getElementById('editModal').classList.add('hidden');
            currentActiveId = null;
        }

        function adjustScore(amount) {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.score = Math.max(0, student.score + amount);
                updateCloud();
                document.getElementById('modalStudentScore').innerText = student.score;
            }
        }

        function setCustomScore() {
            if (currentActiveId === null) return;
            const val = document.getElementById('customScoreInput').value;
            if (val === '') return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.score = Math.max(0, Number(val));
                updateCloud();
                document.getElementById('modalStudentScore').innerText = student.score;
                document.getElementById('customScoreInput').value = '';
            }
        }

        function selectBadge(badgeEmoji) {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.badge = badgeEmoji;
                updateCloud();
                closeModal();
            }
        }

        function saveStudentDetails() {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                // حفظ المسارات المختارة
                const selectedTracks = [];
                document.querySelectorAll('.track-checkbox:checked').forEach(cb => {
                    selectedTracks.push(cb.value);
                });
                student.tracks = selectedTracks;

                // حفظ فكرة المشروع
                student.idea = document.getElementById('projectIdeaInput').value.trim();

                // حفظ الفيد باك والمدرب
                student.feedback = document.getElementById('feedbackType').value;
                student.instructor = document.getElementById('feedbackInstructor').value;

                updateCloud();
                closeModal();
            }
        }

        function clearFeedback() {
            if (currentActiveId === null) return;
            const student = students.find(s => s.id === currentActiveId);
            if (student) {
                student.feedback = '';
                student.instructor = '';
                updateCloud();
                closeModal();
            }
        }

        document.getElementById('searchInput').addEventListener('input', renderStudents);
        document.getElementById('sortSelect').addEventListener('change', renderStudents);

        window.onload = initApp;
    </script>
</body>
</html>
